# Backend — api.lenda.work
server {
    listen 443 ssl;
    server_name api.lenda.work;

    ssl_certificate /etc/letsencrypt/live/api.lenda.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lenda.work/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # Block all internal service-to-service endpoints from the internet.
    # Regex locations take priority over prefix locations in nginx,
    # so this matches before /api/auth/ or /api/booking/ can proxy.
    location ~ /internal/ {
        return 404;
    }

    location /api/auth/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Length' 0;
            return 204;
        }
        proxy_pass http://localhost:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/booking/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Length' 0;
            return 204;
        }
        proxy_pass http://localhost:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect http to https for api subdomain
server {
    listen 80;
    server_name api.lenda.work;
    return 301 https://$host$request_uri;
}

# Frontend — lenda.work (Netlify handles this, just redirect)
server {
    listen 443 ssl;
    server_name lenda.work www.lenda.work;

    ssl_certificate /etc/letsencrypt/live/lenda.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lenda.work/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://lendaapp.netlify.app$request_uri;
}

# Redirect http to https for main domain
server {
    listen 80;
    server_name lenda.work www.lenda.work;
    return 301 https://$host$request_uri;
}
